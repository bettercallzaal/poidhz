name: Refresh Bounty Dashboard

on:
  schedule:
    # HOURLY, and the reason it is safe to be hourly is the `-I '"generated_at"'`
    # guard on the commit step below: a run where only the timestamp moved
    # discards its own diff, so it does not commit, does not push and does not
    # trigger a Vercel build.
    #
    # HISTORY, because this was hourly, then six-hourly, and is now hourly again.
    # It was dropped to six hours when hourly runs deployed ~25x/day - at that
    # point the diff check could never pass, because generated_at churned on
    # every run. That guard now exists and works, so the reason for six hours
    # went away and the comment saying otherwise outlived it.
    #
    # WHY IT MATTERS NOW, measured 2026-09-23 17:5x: the daily run casts a
    # bounty that opens and closes inside 24 hours. poidhz.com was showing
    # **0 claims for bounty 1412 when it had 5** - the feed was four hours old
    # and the round had closed in the meantime. On a twelve-day ladder of
    # one-day bounties, a six-hour refresh means the homepage is wrong about
    # the live round for most of its life, and the number it is wrong about is
    # the one that says whether anyone turned up.
    #
    # The client-side argument in the old comment was right about COUNTDOWNS,
    # which render from deadline timestamps and never needed a rebake. It did
    # not cover claim counts, which only change server-side.
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run dashboard build script
        run: python3 scripts/build-bounty-dashboard.py

      - name: Refresh deadline calendar (scan + calendar + ics)
        # Added 2026-08-20: these went stale for two weeks because only the
        # dashboard was on a schedule (zpoidh issue #6).
        run: |
          python3 scripts/scan-poidh-deadlines.py
          python3 scripts/build-bounty-calendar.py
          python3 scripts/deadlines-to-ics.py

      - name: Refresh live round state
        run: python3 scripts/refresh-rounds.py

      - name: Bake the round state into index.html
        # Added 2026-09-24. Without this the homepage served ZERO round data - measured:
        # `curl https://poidhz.com/` returned 17,546 bytes with no occurrence of 1412, 1410,
        # 1409, leoxcrane or 0.005, while a control search for "poidhz" in the same bytes
        # returned 10. Everything a visitor came for arrived only after a second request.
        # This also regenerates og:description so the share card carries live numbers instead
        # of the same fixed sentence it had in week one. Research doc 2548 has the argument.
        # The page's JavaScript still fetches the feed and overwrites this, so the baked copy
        # is the floor and not the ceiling.
        run: python3 scripts/bake-homepage.py

      - name: Rebuild the gallery from the round state just refreshed
        # Added 2026-09-26, the day it cost something. build-gallery.py reads
        # data/rounds-live.json for each round's status, and THIS WORKFLOW REFRESHED THAT FILE
        # AND LEFT THE PAGE ALONE. So the gallery lagged its own input by however long it took
        # a human to notice, which is unbounded - no other workflow references
        # build-gallery.py or gallery.html at all.
        #
        # Measured the night resolveVote(426) landed: within the hour,
        # check-site-claims.py read "STALE gallery.html: bounty 1412 is WINNER SET but the page
        # says 'OPEN NOW' beside it". A settled round advertised as open, on a live page, to
        # entrants. Rebuilding here makes the page and its data move in one commit.
        run: python3 scripts/build-gallery.py

      - name: Rebuild the feedback pages, whose wording depends on the clock
        # Added 2026-09-27, for a reason that only shows up at a specific hour. Each round's
        # card says "closes" or "closed" and that verb is DERIVED FROM THE DEADLINE AT BUILD
        # TIME. Round four closed at 5pm Eastern; without a rebuild the committed HTML keeps
        # saying "closes" until a human happens to run the builder, which is the same defect
        # gallery.html had - correct logic behind a page nobody regenerates.
        #
        # Cheap and idempotent: the pages only change when their json or the verb changes, and
        # the commit step below discards a no-op diff.
        run: |
          for j in data/feedback/*.json; do
            [ -f "$j" ] || continue
            python3 scripts/build-feedback-pages.py --round "$(basename "$j" .json)"
          done
          python3 scripts/sync-site-nav.py

      - name: Guard against degenerate data
        # Second line of defence. build-bounty-dashboard.py now exits non-zero
        # rather than writing an empty list, but any future path that produces a
        # degenerate file must not reach the commit step either. On 2026-08-23
        # 431f7ea pushed total_bounties: 0 over 100 live listings, and the only
        # reason it recovered was the next scheduled run happening to succeed.
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          bad = []
          p = Path("data/bounty-dashboard.json")
          try:
              d = json.loads(p.read_text())
          except Exception as e:
              print(f"FAIL {p}: unparseable ({e})")
              sys.exit(1)

          n = len(d.get("bounties") or [])
          if n == 0:
              bad.append(f"{p}: bounties list is empty")
          if d.get("total_bounties") != n:
              bad.append(f"{p}: total_bounties {d.get('total_bounties')} does not match {n} entries")

          if bad:
              for b in bad:
                  print("FAIL " + b)
              print("Refusing to commit. The last good data stays on main.")
              sys.exit(1)
          print(f"OK {p}: {n} bounties, self-consistent.")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "poidh-dashboard-refresh[bot]"
          git config user.email "poidh-dashboard-refresh@users.noreply.github.com"

          # -I ignores lines matching the regex, so a run where ONLY
          # generated_at (or the prices-source note) changed does not commit,
          # does not push, and does not trigger a Vercel build.
          # index.html is here because the round table and og:description are baked into it
          # (see the bake step above). It carries no generated_at, so any diff in it is a real
          # change by construction - leaving it out of this list would mean the bake ran every
          # hour and shipped nothing.
          # gallery.html is here for the same reason index.html is: it is baked from the round
          # state this workflow just refreshed, and it carries no generated_at, so any diff in
          # it is a real change. Leaving it out would mean the rebuild step above runs every
          # hour and ships nothing, which is how the page came to advertise a settled round as
          # OPEN NOW.
          FILES="data/bounty-dashboard.json data/bounty-calendar.json data/poidh-deadlines-global.json data/poidh-deadlines.ics data/rounds-live.json index.html gallery.html feedback"
          if ! git diff --quiet -I '"generated_at"' -I '"token_usd_prices_source"' -I '^DTSTAMP' -- $FILES; then
            git add $FILES
            git commit -m "chore: auto-refresh bounty dashboard + deadline calendar data (refresh-bounty-dashboard.yml)"
            git push
          else
            git checkout -- $FILES
            echo "No substantive changes to bounty dashboard data (timestamp-only churn discarded)."
          fi
