name: Refresh Bounty Dashboard

on:
  schedule:
    # Every hour - deadlines/submissions/prices move faster than the leaderboard
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run dashboard build script
        run: python3 scripts/build-bounty-dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "poidh-dashboard-refresh[bot]"
          git config user.email "poidh-dashboard-refresh@users.noreply.github.com"

          if ! git diff --quiet data/bounty-dashboard.json; then
            git add data/bounty-dashboard.json
            git commit -m "chore: auto-refresh bounty dashboard data

Generated by refresh-bounty-dashboard.yml workflow."
            git push
          else
            echo "No changes to bounty dashboard data."
          fi
