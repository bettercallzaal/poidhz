name: Refresh Bounty Dashboard

on:
  schedule:
    # Every 6 hours. Was hourly, but every commit triggers a Vercel build and
    # the diff check below never passed (generated_at churned every run), so
    # this deployed ~25x/day. Countdowns render client-side from deadline
    # timestamps, so hourly rebakes bought nothing. See ZAOOS PR #3147 for the
    # sibling fix.
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run guard tests
        run: python3 -m pytest tests/test_dashboard_guard.py -v

      - name: Run dashboard build script
        run: python3 scripts/build-bounty-dashboard.py

      - name: Refresh deadline calendar (scan + calendar + ics)
        # Added 2026-08-20: these went stale for two weeks because only the
        # dashboard was on a schedule (zpoidh issue #6).
        run: |
          python3 scripts/scan-poidh-deadlines.py
          python3 scripts/build-bounty-calendar.py
          python3 scripts/deadlines-to-ics.py

      - name: Refresh live round state
        run: python3 scripts/refresh-rounds.py

      - name: Commit and push if changed
        run: |
          git config user.name "poidh-dashboard-refresh[bot]"
          git config user.email "poidh-dashboard-refresh@users.noreply.github.com"

          # -I ignores lines matching the regex, so a run where ONLY
          # generated_at (or the prices-source note) changed does not commit,
          # does not push, and does not trigger a Vercel build.
          FILES="data/bounty-dashboard.json data/bounty-calendar.json data/poidh-deadlines-global.json data/poidh-deadlines.ics data/rounds-live.json"
          if ! git diff --quiet -I '"generated_at"' -I '"token_usd_prices_source"' -I '^DTSTAMP' -- $FILES; then
            git add $FILES
            git commit -m "chore: auto-refresh bounty dashboard + deadline calendar data (refresh-bounty-dashboard.yml)"
            git push
          else
            git checkout -- $FILES
            echo "No substantive changes to bounty dashboard data (timestamp-only churn discarded)."
          fi
